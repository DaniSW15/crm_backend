services:
  db:
    image: postgres:16-alpine
    container_name: crm_fastapi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - crm_fastapi_data:/var/lib/postgresql/data

volumes:
  crm_fastapi_data:

